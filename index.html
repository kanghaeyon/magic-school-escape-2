
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>마법학교 탈출 2</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#110e1b;color:#fff;font-family:Arial,'Malgun Gothic',sans-serif}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#hud{position:fixed;top:12px;left:12px;background:#161022f0;padding:10px 15px;border:2px solid #d7b56a;border-radius:2px;box-shadow:0 0 0 2px #2a2036,0 8px 24px #0008;font-size:14px;letter-spacing:.02em}
#dialog{position:fixed;bottom:7%;left:50%;transform:translateX(-50%);width:min(92vw,540px);background:#181222f8;border:2px solid #d7b56a;border-radius:2px;padding:22px;text-align:center;display:none;box-shadow:0 0 0 2px #2a2036,0 12px 50px #0009}
#dialog h2{margin:0;color:#f3d7a2}
#dialog p{line-height:1.8;white-space:pre-line}
button{border:2px solid #e6c98a;background:#3a2a4e;color:white;border-radius:2px;padding:11px 16px;margin:5px;font-size:15px;cursor:pointer}
#toast{position:fixed;top:18%;left:50%;transform:translateX(-50%);background:#181222f2;border:2px solid #d7b56a;border-radius:2px;padding:10px 16px;display:none}
#joy{display:none;position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:128px;height:128px;border-radius:50%;border:2px solid #ddd8;background:#ffffff20;touch-action:none;z-index:12}
#nub{position:absolute;left:42px;top:42px;width:42px;height:42px;border-radius:50%;background:#c9a7eaaa}
#act{display:none;position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));min-width:92px;min-height:68px;font-size:18px;z-index:12}
#wideMenu,#wideTurn{display:none}
#hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;color:#e8dcf3}
#gear{position:fixed;top:12px;right:12px;z-index:16;padding:8px 12px}
#panel{display:none;position:fixed;top:54px;right:12px;z-index:24;width:min(86vw,280px);background:#181222f8;border:2px solid #d7b56a;padding:14px;box-shadow:0 12px 40px #000a}
#panel label{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:16px}
#panel input[type=range]{width:100%}
#menu{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#120d1ce8;text-align:center;padding:24px}
#menu h1{margin:0 0 8px;color:#f3d7a2;font-size:clamp(28px,5vw,46px)}
#menu p{color:#d9cbe6;margin:0 0 18px}
#menu button{min-width:180px;min-height:52px;font-size:20px}
#turn{display:none;position:fixed;inset:0;z-index:80;background:#110e1b;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;font-size:24px;line-height:1.6}
#turn p{margin:0 0 16px}
@media(pointer:coarse){#joy,#act{display:block}#hint{display:none}}
@media(pointer:coarse) and (orientation:landscape){
 #hud{left:50%;right:auto;transform:translateX(-50%);top:8px;font-size:16px;max-width:46vw}
 #dialog{top:46%;bottom:auto;transform:translate(-50%,-50%);width:min(62vw,480px);max-height:76vh;overflow:auto;z-index:20}
 #toast{top:52px}
 #gear{top:8px}
 button,input{font-size:17px}
}
html.mobile,html.mobile body{position:fixed;inset:0;width:100%;height:100%;height:100dvh}
html.mobile canvas{width:100%;height:100%}
html.mobile #wideMenu,html.mobile #wideTurn{display:inline-block}
html.mobile #joy,html.mobile #act{display:block}
html.mobile #hint{display:none}
body.need-turn #turn{display:flex}
@media(orientation:landscape) and (max-height:430px){
 html.mobile #joy{width:104px;height:104px}
 html.mobile #nub{left:33px;top:33px;width:38px;height:38px}
 html.mobile #act{min-width:84px;min-height:56px;font-size:16px;padding:8px 12px}
 html.mobile #hud{top:6px;font-size:14px;padding:6px 10px}
}
body.cinematic #hud,body.cinematic #hint,body.cinematic #joy,body.cinematic #act,body.cinematic #gear,body.cinematic #panel{display:none!important}
body.menu #hud,body.menu #hint,body.menu #joy,body.menu #act,body.menu #gear,body.menu #panel{display:none!important}
#cinema{display:none;position:fixed;inset:0;z-index:30;background:#120d1e;width:100vw;height:100vh}
#skipIntro{display:none;position:fixed;z-index:31;right:16px;top:15px;background:#20152cbd;color:#eee;border:1px solid #a995b5;padding:8px 14px;font-size:13px}
</style>
</head>
<body class="menu">
<div id="turn"><p id="turnNote">휴대폰을 가로로 돌려 주세요</p><button id="wideTurn" type="button">가로 전체 화면</button></div>
<div id="menu">
 <h1>마법학교 탈출 2</h1>
 <p>열쇠로 열었던 문 너머의 이야기</p>
 <button id="newGame" type="button">새 게임</button>
 <button id="continueGame" type="button">이어하기</button>
 <button id="wideMenu" type="button">가로 전체 화면</button>
</div>
<canvas id="cinema"></canvas>
<button id="skipIntro">건너뛰기</button>
<canvas id="c"></canvas>
<div id="hud">마법학교 탈출 2 · <span id="status"></span></div>
<button id="gear" type="button">설정</button>
<div id="panel">
 <label>음악 <input id="musicOn" type="checkbox" checked></label>
 <label>배경음악 <span id="musicLabel">32</span></label>
 <input id="musicVol" type="range" min="0" max="100" value="32">
 <label>효과음 <span id="sfxLabel">70</span></label>
 <input id="sfxVol" type="range" min="0" max="100" value="70">
 <button id="wipe" type="button">진행 기록 초기화</button>
 <button id="closeSet" type="button">닫기</button>
</div>
<div id="toast"></div>
<div id="dialog"><h2 id="title"></h2><p id="message"></p><div id="buttons"></div></div>
<div id="joy"><div id="nub"></div></div>
<button id="act">조사</button>
<div id="hint">WASD / 방향키 이동 · E / Enter 조사 · ESC 닫기</div>

<script>
'use strict';

const c=document.getElementById('c'),g=c.getContext('2d'),dlg=document.getElementById('dialog'),title=document.getElementById('title'),message=document.getElementById('message'),buttons=document.getElementById('buttons'),toast=document.getElementById('toast'),status=document.getElementById('status');
let W,H,DPR;
const mobile=matchMedia('(pointer: coarse)').matches||(navigator.maxTouchPoints>0&&matchMedia('(hover: none)').matches);
if(mobile)document.documentElement.classList.add('mobile');
function resize(){
 const vv=window.visualViewport;
 W=Math.round(vv?vv.width:innerWidth);H=Math.round(vv?vv.height:innerHeight);DPR=Math.min(devicePixelRatio||1,2);
 c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);g.setTransform(DPR,0,0,DPR,0,0);
 const cinema=document.getElementById('cinema');
 if(cinema&&cinema.style.display==='block'){cinema.width=Math.round(W*DPR);cinema.height=Math.round(H*DPR)}
}
function syncTurn(){
 const portrait=matchMedia('(orientation: portrait)').matches;
 document.body.classList.toggle('need-turn',mobile&&portrait);
}
let lockTried=false;
async function goLandscape(){
 const root=document.documentElement;
 lockTried=true;
 try{
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
   const req=root.requestFullscreen||root.webkitRequestFullscreen;
   if(req)await req.call(root)
  }
 }catch(e){}
 try{
  if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')
 }catch(e){}
 resize();syncTurn();
 const note=document.getElementById('turnNote');
 if(note&&mobile&&matchMedia('(orientation: portrait)').matches)note.textContent='이 브라우저는 화면을 강제로 돌리지 못합니다. 휴대폰을 가로로 돌려 주세요.';
}
function onViewport(){resize();syncTurn()}
onresize=onViewport;
if(window.visualViewport)visualViewport.addEventListener('resize',onViewport);
if(screen.orientation)screen.orientation.addEventListener('change',onViewport);
document.getElementById('wideMenu').onclick=goLandscape;
document.getElementById('wideTurn').onclick=goLandscape;
resize();syncTurn();

const hall=[{x:100,y:400,w:1550,h:320},{x:1330,y:400,w:320,h:900}];
const doors=[
 {id:'class',name:'마법 교실',x:450,y:400,side:'top'},
 {id:'store',name:'오래된 창고',x:1650,y:1050,side:'right'},
 {id:'final',name:'복도 끝의 문',x:1490,y:1300,side:'bottom'}
];
const p={x:350,y:652,r:17,dir:1,walk:0,arm:0},rp={x:400,y:460};
let scene='hall',room=null,entered=null,paused=false,anim=null,near=null,cam={x:0,y:0},time=0,toastLeft=0,shake=0;
let joyX=0,joyY=0,joyPointer=null;
const keys=new Set();
let audio;

function blankState(){
 return {class:false,store:false,frames:false,collected:{class:false,store:false,frames:false},keys:0}
}
let state=blankState();
let audioPref={on:true,music:32,sfx:70};
try{
 const saved=JSON.parse(localStorage.getItem('magicSchool2Audio')||'{}');
 audioPref={...audioPref,...saved};
 if(saved.music==null)audioPref.music=32
}catch{}

function save(){
 state.keys=Object.values(state.collected).filter(Boolean).length;
 try{localStorage.setItem('magicSchool2StateV2',JSON.stringify(state))}catch{}
 status.textContent=`🗝 열쇠 ${state.keys}/3`
}
function freshGame(){
 state=blankState();
 try{localStorage.removeItem('magicSchool2StateV2')}catch{}
 frameSequence=[];
 p.x=350;p.y=652;p.dir=1;p.walk=0;p.arm=0;
 rp.x=400;rp.y=455;
 scene='hall';room=null;entered=null;anim=null;paused=false;shake=0;scareLeft=0;
 cam.x=0;cam.y=0;
 resetPhantom();
 save();
}
function loadSaved(){
 const base=blankState();
 let data={};
 try{data=JSON.parse(localStorage.getItem('magicSchool2StateV2')||'{}')||{}}catch{}
 state={...base,...data,collected:{...base.collected,...(data.collected||{})}};
 save();
}

function keyAvailable(kind){return state[kind]&&!state.collected[kind]}

function pickup(kind){
 if(!keyAvailable(kind))return;
 state.collected[kind]=true;save();chime();
 popup('열쇠 획득!',`연미가 바닥에서 반짝이는 열쇠를 주웠다.\n현재 열쇠 ${state.keys}/3개`,[['계속하기',close]])
}

function pickupNear(){
 if(scene==='hall')return keyAvailable('frames')&&Math.hypot(p.x-1200,p.y-565)<95?'frames':null;
 if(room==='class'&&keyAvailable('class')&&Math.hypot(rp.x-540,rp.y-460)<90)return 'class';
 if(room==='store'&&keyAvailable('store')&&Math.hypot(rp.x-540,rp.y-460)<90)return 'store';
 return null
}

function drawKey(x,y,scale=1){
 g.save();g.translate(Math.round(x),Math.round(y+Math.sin(time*4)*6));g.scale(scale,scale);
 g.imageSmoothingEnabled=false;
 glow(0,0,43,'#ffe08399');
 const q=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
 q(-16,-16,14,14,'#ffe7a4');
 q(-12,-12,6,6,'#6a4a18');
 q(-4,-8,22,4,'#ffe7a4');
 q(8,-4,4,6,'#ffe7a4');
 q(14,-4,4,8,'#ffe7a4');
 q(6,0,4,5,'#ffe7a4');
 g.restore()
}

let sfxGain,calmGain,chaseGain;
function midi(n){return 440*Math.pow(2,(n-69)/12)}
function writeNote(data,sr,time,freq,dur,amp,kind){
 const start=Math.floor(time*sr),n=Math.min(data.length-start,Math.floor(dur*sr));
 const partials=kind==='box'?[[1,.62],[2.01,.12],[2.76,.05],[4.02,.02]]:[[1,.55],[2,.16],[3,.05]];
 for(let i=0;i<n;i++){
  const t=i/sr;
  const env=Math.sin(Math.min(1,t*90)*Math.PI/2)*Math.exp(-t*(kind==='box'?3.1:1.7));
  let s=0;
  for(const [ratio,gain] of partials)s+=Math.sin(2*Math.PI*freq*ratio*t)*gain;
  data[start+i]+=s*env*amp
 }
}
function renderScore(events,seconds){
 const sr=22050,data=new Float32Array(Math.ceil(seconds*sr));
 for(const [beat,note,dur,amp,kind] of events)writeNote(data,sr,beat,midi(note),dur,amp,kind);
 let peak=0.001;
 for(let i=0;i<data.length;i++)peak=Math.max(peak,Math.abs(data[i]));
 const buf=audio.createBuffer(1,data.length,sr),out=buf.getChannelData(0);
 for(let i=0;i<data.length;i++)out[i]=data[i]/peak*.8;
 return buf
}
function loopBuffer(buf,gain){
 const src=audio.createBufferSource();
 src.buffer=buf;src.loop=true;src.connect(gain);src.start();
 return src
}
function ensureAudio(){
 if(audio){audio.resume();return}
 audio=new(window.AudioContext||window.webkitAudioContext)();
 sfxGain=audio.createGain();sfxGain.connect(audio.destination);
 calmGain=audio.createGain();calmGain.gain.value=0;calmGain.connect(audio.destination);
 chaseGain=audio.createGain();chaseGain.gain.value=0;chaseGain.connect(audio.destination);
 const beat=60/72;
 const calm=[
  [0,74,beat*.92,.22,'box'],[beat,77,beat*.42,.18,'box'],[beat*1.5,81,beat*.42,.16,'box'],[beat*2,77,beat*.9,.18,'box'],[beat*3,74,beat*.9,.16,'box'],
  [beat*4,76,beat*.9,.18,'box'],[beat*5,72,beat*.9,.16,'box'],[beat*6,74,beat*1.4,.18,'box'],[beat*7.5,69,beat*.42,.14,'box'],
  [beat*8,70,beat*.9,.16,'box'],[beat*9,74,beat*.42,.16,'box'],[beat*9.5,77,beat*.42,.15,'box'],[beat*10,74,beat*.9,.16,'box'],[beat*11,69,beat*.9,.14,'box'],
  [beat*12,72,beat*.9,.16,'box'],[beat*13,69,beat*.42,.14,'box'],[beat*13.5,67,beat*.42,.13,'box'],[beat*14,69,beat*.9,.15,'box'],[beat*15,74,beat*.9,.16,'box'],
  [0,50,beat*2.2,.1,'piano'],[0,53,beat*2.2,.08,'piano'],[0,57,beat*2.2,.07,'piano'],
  [beat*4,48,beat*2.2,.09,'piano'],[beat*4,52,beat*2.2,.07,'piano'],[beat*4,55,beat*2.2,.06,'piano'],
  [beat*8,46,beat*2.2,.09,'piano'],[beat*8,50,beat*2.2,.07,'piano'],[beat*8,53,beat*2.2,.06,'piano'],
  [beat*12,45,beat*2.2,.09,'piano'],[beat*12,48,beat*2.2,.07,'piano'],[beat*12,52,beat*2.2,.06,'piano']
 ];
 const cBeat=60/104;
 const chase=[
  [0,62,cBeat*.4,.2,'piano'],[cBeat*.5,65,cBeat*.4,.16,'box'],[cBeat,69,cBeat*.4,.16,'box'],[cBeat*1.5,72,cBeat*.4,.14,'box'],
  [cBeat*2,70,cBeat*.4,.16,'box'],[cBeat*2.5,69,cBeat*.4,.15,'box'],[cBeat*3,65,cBeat*.4,.14,'box'],[cBeat*3.5,62,cBeat*.45,.16,'piano'],
  [0,50,cBeat*1.2,.1,'piano'],[0,57,cBeat*1.2,.07,'piano'],
  [cBeat*2,46,cBeat*1.2,.1,'piano'],[cBeat*2,53,cBeat*1.2,.07,'piano']
 ];
 loopBuffer(renderScore(calm,beat*16),calmGain);
 loopBuffer(renderScore(chase,cBeat*4),chaseGain);
 applyMix();
 audio.resume();
}
function saveAudio(){try{localStorage.setItem('magicSchool2Audio',JSON.stringify(audioPref))}catch{}}
function applyMix(){
 if(!sfxGain)return;
 sfxGain.gain.setTargetAtTime(audioPref.sfx/100,audio.currentTime,.05);
 updateMusic()
}
function beep(f=330,d=.12,type='sine',gain=.05){
 try{
  if(!audio)return;
  const o=audio.createOscillator(),v=audio.createGain();
  o.type=type;o.frequency.value=f;
  const now=audio.currentTime;
  v.gain.setValueAtTime(gain,now);
  v.gain.exponentialRampToValueAtTime(.001,now+d);
  o.connect(v);v.connect(sfxGain);o.start();o.stop(now+d)
 }catch{}
}
function sfxDoor(kind){
 if(kind==='open'){beep(220,.12,'sine',.05);setTimeout(()=>beep(340,.16,'triangle',.04),90)}
 else{beep(150,.1,'square',.05);setTimeout(()=>beep(90,.16,'sine',.04),110)}
}
function sfxStep(){beep(78,.045,'triangle',.03)}
function sfxSpot(){beep(96,.22,'sawtooth',.06);setTimeout(()=>beep(140,.16,'triangle',.04),120)}
function clank(){beep(170,.09,'square',.05);setTimeout(()=>beep(120,.09,'square',.04),140)}
function chime(){beep(440,.12,'sine',.06);setTimeout(()=>beep(660,.16,'triangle',.05),120);setTimeout(()=>beep(880,.18,'sine',.04),240)}
let stepAcc=0;
function updateMusic(){
 if(!calmGain)return;
 const now=audio.currentTime;
 const chasing=audioPref.on&&phantom.visible&&(phantom.mode==='alert'||phantom.mode==='chase');
 const level=audioPref.on?(audioPref.music/100)*.28:0;
 calmGain.gain.setTargetAtTime(chasing?0:(scene==='room'?level*.7:level),now,.45);
 chaseGain.gain.setTargetAtTime(chasing?level*1.05:0,now,.2)
}
function note(s,sec=2){toast.textContent=s;toast.style.display='block';toastLeft=sec}
function popup(t,s,opts){
 paused=true;title.textContent=t;message.textContent=s;buttons.replaceChildren();
 opts.forEach(([label,fn])=>{
  const b=document.createElement('button');
  b.textContent=label;b.onclick=()=>{beep(480,.05);fn()};
  buttons.append(b)
 });
 dlg.style.display='block'
}
function close(){paused=false;dlg.style.display='none'}

function inside(x,y,r=0){
 return [[x,y],[x-r,y],[x+r,y],[x,y-r],[x,y+r],[x-r*.71,y-r*.71],[x+r*.71,y-r*.71],[x-r*.71,y+r*.71],[x+r*.71,y+r*.71]].every(([a,b])=>hall.some(h=>a>=h.x&&a<=h.x+h.w&&b>=h.y&&b<=h.y+h.h))
}
function move(dx,dy){
 if(scene==='hall'){
  if(inside(p.x+dx,p.y,p.r))p.x+=dx;
  if(inside(p.x,p.y+dy,p.r))p.y+=dy
 }else{
  rp.x=Math.max(90,Math.min(710,rp.x+dx));
  rp.y=Math.max(250,Math.min(505,rp.y+dy))
 }
}
function nearest(){
 let best=null,dist=105;
 for(const d of doors){
  const n=Math.hypot(p.x-d.x,p.y-d.y);
  if(n<dist){dist=n;best=d}
 }
 return best
}
function target(d){
 if(d.side==='top')return{x:d.x,y:d.y+39};
 if(d.side==='bottom')return{x:d.x,y:d.y-39};
 if(d.side==='left')return{x:d.x+39,y:d.y};
 return{x:d.x-39,y:d.y}
}
function startAnim(type,d,done){
 close();anim={type,door:d,stage:0,t:0,done};p.arm=0
}

function doorAction(d){
 if(d.id==='final'){
  if(state.class&&state.store&&state.frames&&state.keys>=3){
   popup('마지막 문','열쇠 세 개가 맞물린다. 문을 열겠습니까?',[
    ['문 열기',()=>startAnim('final',d,()=>popup('탈출 성공','연미는 마법학교의 마지막 문을 열었다.\n하지만 문 너머에서 또 다른 기척이 들린다.',[['처음으로',()=>{close();p.x=250;p.y=560}]]))],
    ['지나가기',close]
   ])
  }else{
   clank();
   popup('철컥! 철컥!','문이 열리지 않는다.\n마법 교실의 숫자 문제, 창고의 물약 암호, 복도의 액자 순서를 모두 해결하고 열쇠 세 개를 찾아야 한다.',[['돌아가기',close]])
  }
  return
 }
 popup(d.name,`${d.name}이다.\n문을 열겠습니까?`,[
  ['문 열기',()=>startAnim('enter',d,()=>{scene='room';room=d.id;entered=d;rp.x=400;rp.y=455;note(d.name+'에 들어왔다')})],
  ['지나가기',close]
 ])
}

// 방에서 나올 때는 그림자를 멀리 보내고 잠시 추격하지 않는다.
function giveExitBreathingRoom(){
 phantom.visible=false;
 phantom.mode='patrol';
 phantom.alert=0;
 phantom.lost=0;
 phantom.active=0;
 phantom.cooldown=8;
 phantom.safeAfterExit=11;

 // 현재 위치에서 가장 먼 복도 순찰 지점을 골라 재등장시킨다.
 let far=phantomPath[0],max=-1;
 for(const point of phantomPath){
  const d=Math.hypot(point.x-p.x,point.y-p.y);
  if(d>max){max=d;far=point}
 }
 phantom.x=far.x;phantom.y=far.y;
 phantom.route=phantomPath.indexOf(far);
}

function roomDoorNear(){return Math.hypot(rp.x-400,rp.y-510)<100}

function interact(){
 if(paused||anim)return;
 const found=pickupNear();
 if(found){pickup(found);return}
 if(scene==='hall'){
  if(Math.hypot(p.x-350,p.y-720)<95){
   note('문이 잠겨 있다. 이제 돌아갈 수 없다.');return
  }
  const d=nearest();
  if(d)doorAction(d);

function animate(dt){
 if(!anim)return;
 const a=anim;a.t+=dt;
 if(a.type==='leave'){
  if(a.stage===0&&a.t>1.05){a.stage=1;sfxDoor('open')}
  if(a.stage===1&&a.t>1.65){a.stage=2;sfxDoor('close')}
  if(a.t>2.25){anim=null;a.done()}
  return
 }
 if(a.stage===0){
  const t=target(a.door),dx=t.x-p.x,dy=t.y-p.y,dist=Math.hypot(dx,dy);
  if(dist>4){
   const step=Math.min(dist,170*dt);
   move(dx/dist*step,dy/dist*step);
   p.walk=1
  }else{p.walk=0;a.stage=1;a.t=0}
 }else if(a.stage===1){
  p.arm=Math.min(1,a.t/.4);
  if(a.t>.55){a.stage=2;a.t=0;sfxDoor('open')}
 }else if(a.stage===2&&a.t>.55){
  a.stage=3;a.t=0;p.arm=0;p.walk=1
 }else if(a.stage===3&&a.t>.45){
  p.walk=0;sfxDoor('close');anim=null;a.done()
 }
}

const phantomPath=[
 {x:1100,y:565},
 {x:1480,y:565},
 {x:1490,y:1010},
 {x:1490,y:565}
];
let scareLeft=0,scareSoundPlayed=false,scareSeed=0;

function scareStart(){
 if(scareLeft>0)return;
 scareLeft=1.6;scareSoundPlayed=false;scareSeed=Math.random()*999;
 phantom.visible=false;phantom.active=0;phantom.mode='patrol';
 phantom.dread=0;shake=0;
 phantom.cooldown=13+Math.random()*9;
 p.walk=0;p.arm=0
}

function phantomInside(x,y){
 return (x>=116&&x<=1634&&y>=416&&y<=704)||
        (x>=1346&&x<=1634&&y>=416&&y<=1284)
}

function phantomClearPath(x1,y1,x2,y2){
 const count=Math.max(1,Math.ceil(Math.hypot(x2-x1,y2-y1)/20));
 for(let i=0;i<=count;i++){
  const t=i/count;
  if(!phantomInside(x1+(x2-x1)*t,y1+(y2-y1)*t))return false
 }
 return true
}

function phantomMoveTo(x,y,speed,dt){
 const dx=x-phantom.x,dy=y-phantom.y,len=Math.hypot(dx,dy);
 if(len<6)return true;
 const step=Math.min(len,speed*dt);
 const mx=dx/len*step,my=dy/len*step;
 if(phantomInside(phantom.x+mx,phantom.y+my)){phantom.x+=mx;phantom.y+=my}
 else{
  if(phantomInside(phantom.x+mx,phantom.y))phantom.x+=mx;
  if(phantomInside(phantom.x,phantom.y+my))phantom.y+=my
 }
 return Math.hypot(x-phantom.x,y-phantom.y)<10
}
function phantomChaseGoal(){
 const corner={x:1490,y:560};
 if(phantomClearPath(phantom.x,phantom.y,p.x,p.y))return{x:p.x,y:p.y};
 if(Math.hypot(phantom.x-corner.x,phantom.y-corner.y)>28)return corner;
 return{x:p.x,y:p.y}
}

function phantomUpdate(dt){
 if(scene!=='hall'||!introDone||paused||anim||scareLeft>0)return;
 if(phantom.safeAfterExit>0){
  phantom.safeAfterExit=Math.max(0,phantom.safeAfterExit-dt)
 }
 if(!phantom.visible){
  phantom.cooldown-=dt;
  if(phantom.cooldown<=0){
   phantom.visible=true;
   phantom.active=0;
   phantom.mode='patrol';
   phantom.alert=0;
   phantom.lost=0;
   if(phantom.safeAfterExit<=0){
    phantom.x=1485;phantom.y=560;phantom.route=2
   }
   beep(82,.16,'triangle')
  }
  return
 }
 phantom.active+=dt;
 const distance=Math.hypot(p.x-phantom.x,p.y-phantom.y);

 if(distance<63&&phantom.safeAfterExit<=0){
  scareStart();return
 }

 const seen=phantom.safeAfterExit<=0&&distance<390&&phantomClearPath(phantom.x,phantom.y,p.x,p.y);
 if(phantom.safeAfterExit<=0&&phantom.mode==='patrol'&&seen){
  phantom.mode='alert';
  phantom.alert=0;
  sfxSpot()
 }

 if(phantom.mode==='alert'){
  phantom.alert+=dt;
  phantomMoveTo(phantomChaseGoal().x,phantomChaseGoal().y,150,dt);
  if(!seen&&distance>460)phantom.mode='patrol';
  else if(phantom.alert>.16){
   phantom.mode='chase';
   phantom.hunt=7.5;
   phantom.lost=0;
   beep(105,.22,'triangle')
  }
 }else if(phantom.mode==='chase'){
  if(seen)phantom.hunt=Math.max(phantom.hunt,6.5);
  phantom.hunt-=dt;
  phantomMoveTo(phantomChaseGoal().x,phantomChaseGoal().y,192,dt);
  phantom.stepSound-=dt;
  if(phantom.stepSound<=0&&distance<420){
   beep(76,.06,'triangle');
   phantom.stepSound=distance<150?.28:.48
  }
  phantom.dread=distance<165?Math.min(1,(165-distance)/110):0;
  if(phantom.dread>0){
   shake=phantom.dread*14;
   phantom.heart-=dt;
   if(phantom.heart<=0){
    beep(58+phantom.dread*30,.08,'sawtooth');
    phantom.heart=.62-phantom.dread*.34
   }
  }else shake=0;
  if(phantom.hunt<=0&&!seen){
   phantom.mode='search';
   phantom.lost=0;
   phantom.dread=0;
   shake=0
  }
 }else if(phantom.mode==='search'){
  phantom.lost+=dt;
  phantomMoveTo(phantomChaseGoal().x,phantomChaseGoal().y,130,dt);
  if(distance<270&&phantomClearPath(phantom.x,phantom.y,p.x,p.y)){
   phantom.mode='alert';
   phantom.alert=.3
  }else if(phantom.lost>2){
   phantom.mode='patrol';
   phantom.route=0
  }
 }else{
  const goal=phantomPath[phantom.route];
  if(phantomMoveTo(goal.x,goal.y,phantom.speed,dt)){
   phantom.route=(phantom.route+1)%phantomPath.length
  }
 }

 if(phantom.active>24&&phantom.mode==='patrol'){
  phantom.visible=false;
  phantom.cooldown=9+Math.random()*10
 }
}

function phantomDraw(){
 if(!phantom.visible||scene!=='hall')return;
 g.save();g.translate(Math.round(phantom.x),Math.round(phantom.y));
 g.imageSmoothingEnabled=false;
 glow(0,-18,72,'#050308bb');
 g.fillStyle='#07060c';

 g.fillRect(-22,-18,12,30);
 g.fillRect(10,-18,12,30);
 g.fillRect(-24,-50,10,18);
 g.fillRect(14,-50,10,18);
 g.fillStyle='#e9e0ef';
 g.fillRect(-9,-70,6,3);
 g.fillRect(4,-70,6,3);
 g.restore()
}

function scareDraw(dt){
 if(scareLeft<=0)return;
 if(!scareSoundPlayed){
  scareSoundPlayed=true;
  beep(70,.65,'sawtooth');
  setTimeout(()=>beep(46,.36,'square'),110)
 }
 const elapsed=1.6-scareLeft;
 const jitter=elapsed<.75?24:5;

 g.fillStyle=elapsed<1.05?'#16090f':'#05040a';
 g.fillRect(-30,-30,W+60,H+60);

 if(elapsed<1.05){
  const scale=Math.min(W/500,H/460)*(.9+elapsed*.65);
  g.translate(W/2,H/2);g.scale(scale,scale);
  g.fillStyle='#030307';
  g.beginPath();g.ellipse(0,0,165,215,0,0,Math.PI*2);g.fill();
  g.fillStyle='#e9d9e4';
  g.beginPath();g.ellipse(-67,-40,43,24,-.15,0,Math.PI*2);g.fill();
  g.beginPath();g.ellipse(67,-40,43,24,.15,0,Math.PI*2);g.fill();
  g.fillStyle='#210713';
  g.beginPath();g.arc(-67,-39,16,0,Math.PI*2);
  g.arc(67,-39,16,0,Math.PI*2);g.fill();
  g.fillStyle='#a92540';
  g.beginPath();g.ellipse(0,94,66,75,0,0,Math.PI*2);g.fill();
  g.fillStyle='#f0d7c9';
  for(let i=-2;i<=2;i++){
   g.beginPath();
   g.moveTo(i*23-11,39);
   g.lineTo(i*23,78);
   g.lineTo(i*23+11,39);
   g.fill()
  }
  g.setTransform(DPR,0,0,DPR,0,0);
  txt('쾅!',W/2,H*.83,Math.min(65,W/6),'#f4d7e1')
 }
 g.restore();
 scareLeft-=dt;
 if(scareLeft<=0){
  scareLeft=0;
  phantom.visible=false;
  const d=entered||doors[0],t=target(d);
  scene='hall';room=null;p.x=t.x;p.y=t.y;
  cam.x=Math.max(0,Math.min(2200-W,p.x-W/2));
  cam.y=Math.max(0,Math.min(1500-H,p.y-H/2));
  note('정신을 차려 보니 문 앞이다…',3)
 }
}

function cameraView(){
 return matchMedia('(pointer:coarse)').matches&&W>H?1.42:1
}
let last=performance.now();
function loop(now){
 const dt=Math.min((now-last)/1000,.04);
 last=now;time+=dt;
 if(toastLeft>0){
  toastLeft-=dt;
  if(toastLeft<=0)toast.style.display='none'
 }
 if(anim)animate(dt);
 else if(!paused&&scareLeft<=0){
  let dx=joyX,dy=joyY;
  if(keys.has('a')||keys.has('arrowleft'))dx--;
  if(keys.has('d')||keys.has('arrowright'))dx++;
  if(keys.has('w')||keys.has('arrowup'))dy--;
  if(keys.has('s')||keys.has('arrowdown'))dy++;
  const n=Math.hypot(dx,dy);
  if(n>.08){
   dx/=Math.max(1,n);dy/=Math.max(1,n);
   move(dx*205*dt,dy*205*dt);
   p.walk=1;
   if(dx)p.dir=Math.sign(dx);
   stepAcc-=dt;
   if(stepAcc<=0){sfxStep();stepAcc=.42}
  }else p.walk=0
 }
 updateMusic();
 phantomUpdate(dt);
 g.clearRect(0,0,W,H);
 const view=cameraView();
 if(scene==='hall'){
  near=nearest();
  const vw=W/view,vh=H/view;
  const cx=Math.max(0,Math.min(Math.max(0,2200-vw),p.x-vw/2));
  const cy=Math.max(0,Math.min(Math.max(0,1500-vh),p.y-vh/2));
  cam.x+=(cx-cam.x)*Math.min(1,dt*9);
  cam.y+=(cy-cam.y)*Math.min(1,dt*9);
  const jx=(Math.random()-.5)*shake,jy=(Math.random()-.5)*shake;
  g.save();
  g.translate(W/2,H/2);g.scale(view,view);g.translate(-vw/2,-vh/2);
  g.translate(-cam.x+jx,-cam.y+jy);
  hallDraw();phantomDraw();
  g.restore();
  if(phantom.dread>0){
   const vg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.18,W/2,H/2,Math.min(W,H)*.7);
   vg.addColorStop(0,'rgba(0,0,0,0)');
   vg.addColorStop(1,`rgba(84,0,18,${phantom.dread*.75})`);
   g.fillStyle=vg;g.fillRect(0,0,W,H)
  }
  const touch=matchMedia('(pointer:coarse)').matches;
  if(pickupNear()&&!paused&&!anim){
   txt(touch?'조사 · 열쇠':'E · 열쇠 줍기',W/2,touch?72:H-85,touch?18:19,'#ffe7a2')
  }
  if(near&&!paused&&!anim){
   const sx=(near.x-cam.x)*view,sy=(near.y-cam.y)*view;
   box(sx-75,sy-115,150,30,'#251b36df','#d6b9ed',7);
   txt((touch?'조사 · ':'E · ')+near.name,sx,sy-94,touch?16:13)
  }
 }else roomDraw();
 scareDraw(dt);
 requestAnimationFrame(loop)
}
requestAnimationFrame(loop);

function introFrame(now){
 if(introDone)return;
 if(!introStart)introStart=now;
 const t=(now-introStart)/1000;
 introCanvas.width=Math.round(W*DPR);
 introCanvas.height=Math.round(H*DPR);
 ig.setTransform(DPR,0,0,DPR,0,0);
 const cw=W,ch=H;
 ig.fillStyle='#130f20';
 ig.fillRect(0,0,cw,ch);
 const scale=Math.max(1.1,Math.min(cw/650,ch/520)*1.6);
 const dx=cw/2,dy=ch*.43;

 ig.save();ig.translate(dx,dy);ig.scale(scale,scale);
 ig.fillStyle='#30223d';ig.fillRect(-330,-250,660,500);
 ig.fillStyle='#4b3656';ig.fillRect(-330,60,660,190);
 ig.fillStyle='#a18aa0';ig.fillRect(-330,58,660,3);
 if(doorReference.complete&&doorReference.naturalWidth){
  ig.drawImage(doorReference,-90,-175,180,116)
 }else{
  ig.fillStyle='#36203f';ig.fillRect(-66,-175,132,116);
  ig.strokeStyle='#a18aa0';ig.strokeRect(-66,-175,132,116)
 }

 const opening=Math.max(0,Math.min(1,(t-2.1)/.9));
 ig.fillStyle='#39223e';ig.fillRect(-65,-174,130,114);
 ig.strokeStyle='#a895ae';ig.lineWidth=2;ig.strokeRect(-65,-174,130,114);
 ig.fillStyle='#090715';ig.fillRect(-62,-171,124,108);
 if(opening<1){
  ig.fillStyle='#38233f';
  ig.fillRect(-62,-171,124*(1-opening),108);
  ig.fillStyle='#e8c653';
  ig.beginPath();ig.arc(-62+106*(1-opening),-114,4,0,7);ig.fill()
 }
 const px=t<1.3?-148+Math.max(0,t)*65:t<3.6?-63:t<4.2?-63+(t-3.6)*105:-20;
 if(t<4.15)introPerson(px,-50,1.3,t>1.4&&t<3.1?1:0,false);
 ig.restore();

 if(t>=3.7&&t<5.2){
  ig.fillStyle=`rgba(5,3,12,${Math.min(1,(t-3.7)/.75)})`;
  ig.fillRect(0,0,cw,ch)
 }
 if(t>=4.6){
  const a=Math.min(1,(t-4.6)/.65);
  ig.fillStyle=`rgba(24,18,35,${a})`;
  ig.fillRect(0,0,cw,ch);
  ig.save();ig.globalAlpha=a;
  const floor=ch*.72;
  ig.fillStyle='#54455d';
  ig.beginPath();ig.moveTo(0,floor);ig.lineTo(cw,floor);
  ig.lineTo(cw,ch);ig.lineTo(0,ch);ig.fill();
  ig.fillStyle='#2c2137';ig.fillRect(0,0,cw,floor);
  ig.fillStyle='#130e1d';
  ig.beginPath();
  ig.moveTo(cw*.40,ch*.21);ig.lineTo(cw*.60,ch*.21);
  ig.lineTo(cw*.77,floor);ig.lineTo(cw*.23,floor);
  ig.closePath();ig.fill();
  ig.strokeStyle='#a48aaf';ig.lineWidth=4;
  ig.beginPath();
  ig.moveTo(cw*.23,floor);ig.lineTo(cw*.40,ch*.21);
  ig.moveTo(cw*.77,floor);ig.lineTo(cw*.60,ch*.21);
  ig.stroke();

  const entryX=cw*.49,entryY=floor+ch*.12;
  ig.fillStyle='#b39db9';ig.fillRect(entryX-58,entryY-8,116,77);
  ig.fillStyle='#3c2549';ig.fillRect(entryX-54,entryY-5,108,73);
  const doorOpen=Math.max(0,Math.min(1,(t-4.65)/.7));
  ig.fillStyle='#100b18';ig.fillRect(entryX-50,entryY,100,65);
  if(doorOpen<1){
   ig.fillStyle='#4a2c55';
   ig.fillRect(entryX-50,entryY,100*(1-doorOpen),65)
  }
  const walk=Math.max(0,Math.min(1,(t-5.05)/.65));
  introPerson(entryX,entryY+48-walk*ch*.20,1.55,t>4.75&&t<5.25?1:0,t>5.75);
  if(t>=5.75){
   ig.fillStyle='#4a2c55';ig.fillRect(entryX-50,entryY,100,65);
   ig.fillStyle='#e8c653';ig.fillRect(entryX+34,entryY+31,6,6)
  }
  ig.restore()
 }
 if(t>=5.2&&t<5.9){
  const flash=Math.max(0,1-(t-5.2)/.18);
  ig.fillStyle=`rgba(240,219,255,${flash*.65})`;
  ig.fillRect(0,0,cw,ch)
 }
 if(t>6.65&&t<7.7){
  const flicker=(Math.sin(t*47)>0?0.28:0.05);
  ig.fillStyle=`rgba(0,0,0,${flicker})`;
  ig.fillRect(0,0,cw,ch)
 }
 if(t>=7.0&&t<7.53){
  const u=(t-7)/.53;
  const x=cw*.32+cw*.38*u,y=ch*.52;
  ig.fillStyle='#05040a';
  ig.beginPath();ig.ellipse(x,y-37,10,14,0,0,7);ig.fill();
  ig.beginPath();
  ig.moveTo(x-10,y-27);ig.lineTo(x+10,y-27);
  ig.lineTo(x+17,y+12);ig.lineTo(x-16,y+12);ig.fill();
  ig.fillRect(x-9,y+7,6,22);
  ig.fillRect(x+4,y+7,6,22)
 }
 if(t>=5.25&&t<6.55)introText('쾅!',ch*.19,Math.min(40,cw*.075),'#f0d4e7');
 if(t>=6.1&&t<6.9)introText('아직 끝난 게 아니었어?',ch*.88,Math.min(22,cw*.047));
 if(t>=7.9&&t<9.1)introText('방금… 뭐였지?',ch*.88,Math.min(22,cw*.047));

 const stage=t>=7?3:t>=6.65?2:t>=5.2?1:0;
 if(stage!==introLastStage){
  introLastStage=stage;
  if(stage===1){
   beep(95,.42,'sawtooth');
   if(navigator.vibrate)navigator.vibrate(120)
  }
  if(stage===2)beep(240,.08);
  if(stage===3)beep(110,.18,'triangle')
 }
 if(t>=9.2){introFinish();return}
 requestAnimationFrame(introFrame)
}
